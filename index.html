async function refresh(options={}){const epoch=++refreshEpoch,request={view,marketPage,marketSearch:query,userPage,userSearch:userSearchQuery,requestKind:marketKind,crewGroup:marketGroup,cycle:marketCycle,batch:marketBatch,jobTitle:marketJob,compatibleOnly:marketCompatible},key=JSON.stringify(request);$('app').setAttribute('aria-busy','true');if(!options.useCache)readCache.clear();const cached=options.useCache?readCache.get(key):null,began=Date.now();let result;try{result=cached&&Date.now()-cached.at<15000?cached.data:await rpc('read',token,{...request,fresh:!options.useCache});}catch(e){if(epoch===refreshEpoch)$('app').removeAttribute('aria-busy');readCache.clear();throw e;}if(epoch!==refreshEpoch)return;if(result!==cached?.data){readCache.set(key,{at:Date.now(),data:result});if(readCache.size>12)readCache.delete(readCache.keys().next().value);loadTiming={totalMs:Date.now()-began,...result.loadMetrics};}$('app').removeAttribute('aria-busy');data=result;$('globalError').textContent='';if(data.user.mustChangePassword){readCache.clear();forcePasswordPage();return;}render();if(!options.useCache)pollNotices(true);const status=$('loadTiming');if(status)status.textContent=result===cached?.data?'Dữ liệu vừa tải':`Tải dữ liệu: ${(loadTiming.totalMs/1000).toFixed(1)}s${loadTiming.serverMs!==undefined?' · Xử lý: '+(loadTiming.serverMs/1000).toFixed(1)+'s':''}`;}
async function start(){if(token){try{await refresh();return;}catch(e){sessionStorage.removeItem('btToken');token='';error(e);}}login();}
let noticeItems=[],noticeTimer=null,noticePending=false,noticeAgain=false,noticeGeneration=0,noticeError='',noticeFilter='all';
function stopNotices(){noticeGeneration++;if(noticeTimer)clearTimeout(noticeTimer);noticeTimer=null;noticeItems=[];noticeFilter='all';noticePending=false;noticeAgain=false;const shell=$('noticeShell');if(shell)shell.hidden=true;closeNotices();}
function closeNotices(){const panel=$('noticePanel'),bell=$('noticeBell');if(panel)panel.hidden=true;if(bell)bell.setAttribute('aria-expanded','false');}
function startNotices(){const shell=$('noticeShell');if(!shell||!data||data.user.mustChangePassword)return;shell.hidden=false;if(!noticeTimer&&!noticePending)scheduleNotices();}
function scheduleNotices(){if(noticeTimer)clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>{noticeTimer=null;pollNotices();},65000+Math.floor(Math.random()*10000));noticeTimer?.unref?.();}
async function noticeCall(name,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(Error(e.message||String(e))))[name](...args));}
async function pollNotices(force=false){if(!token||!data||data.user.mustChangePassword||!window.google?.script?.run)return;if(noticePending){if(force)noticeAgain=true;return;}if(document.visibilityState==='hidden'){scheduleNotices();return;}const generation=noticeGeneration,session=token;noticePending=true;try{const result=await noticeCall('readNotices',session);if(generation!==noticeGeneration||session!==token)return;noticeItems=result.items||[];noticeError='';renderNotices(result.unread);}catch(e){if(generation===noticeGeneration){noticeError='Chưa tải được thông báo. Hệ thống sẽ thử lại.';renderNotices();}}finally{if(generation===noticeGeneration)noticePending=false;if(generation===noticeGeneration&&token&&data){if(noticeAgain){noticeAgain=false;pollNotices(true);}else scheduleNotices();}}}
function noticeVisual(view){const icons={review:['Phê duyệt','M9 11l2 2 4-4M5 4h14v16H5z'],users:['Tài khoản','M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8M5 21v-2a7 7 0 0 1 14 0v2'],market:['Market','M4 7h16m-4-4 4 4-4 4M20 17H4m4-4-4 4 4 4'],aims:['AIMS','M5 12l4 4L19 6'],manage:['Quản lý đơn','M7 3h10v4H7zM5 5H3v16h18V5h-2M7 12h10M7 16h7'],operations:['Vận hành','M12 3v10m0 4v1M3 21 12 3l9 18z']};const [label,path]=icons[view]||['Đơn Swap','M4 7h16m-4-4 4 4-4 4M20 17H4m4-4-4 4 4 4'];return {label,svg:'<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="'+path+'" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>'};}
function noticeTime(at){const time=new Date(at);if(!Number.isFinite(time.getTime()))return '';return time.toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Ho_Chi_Minh'});}
function noticeMarkup(rows){return rows.length?rows.map(n=>{const visual=noticeVisual(n.view);return `<button type="button" class="notice-item ${n.read?'':'unread'}" onclick="openNotice(${js(n.id)})" aria-label="${esc(n.title+' · '+(n.read?'Đã đọc':'Chưa đọc'))}"><span class="notice-icon">${visual.svg}</span><span class="notice-copy"><b>${esc(n.title)}</b><span class="notice-description">${esc(n.body)}</span><span class="notice-meta"><span class="notice-kind">${visual.label}</span><time datetime="${esc(n.at)}">${esc(noticeTime(n.at))}</time></span></span>${n.read?'':'<span class="notice-unread-dot" aria-hidden="true"></span>'}</button>`;}).join(''):`<div class="notice-empty"><div class="notice-empty-icon">${noticeVisual('aims').svg}</div><b>${noticeFilter==='unread'?'Bạn đã đọc hết thông báo':'Chưa có thông báo'}</b><p>${noticeFilter==='unread'?'Các thông báo mới sẽ xuất hiện tại đây.':'Thông báo liên quan đến bạn sẽ hiển thị tại đây.'}</p></div>`;}
function filterNotices(filter){noticeFilter=filter==='unread'?'unread':'all';renderNotices();}
function renderNotices(count){const badge=$('noticeBadge'),list=$('noticeList'),status=$('noticeStatus');if(!badge||!list)return;const unread=count??noticeItems.filter(n=>!n.read).length;badge.hidden=unread===0;badge.textContent=unread>99?'99+':String(unread);$('noticeBell')?.setAttribute('aria-label','Thông báo: '+unread+' chưa đọc');const summary=$('noticeSummary'),tabCount=$('noticeTabCount'),readAll=$('noticeReadAll');if(summary)summary.textContent=unread?unread+' thông báo chưa đọc':'Bạn đã cập nhật tất cả thông báo';if(tabCount)tabCount.textContent=unread>99?'99+':String(unread);if(readAll)readAll.disabled=unread===0;$('noticeTabAll')?.setAttribute('aria-pressed',String(noticeFilter==='all'));$('noticeTabUnread')?.setAttribute('aria-pressed',String(noticeFilter==='unread'));list.innerHTML=noticeMarkup(noticeItems.filter(n=>noticeFilter==='all'||!n.read).slice(0,8));if(status){status.textContent=noticeError||'Tự động cập nhật khi bạn đang mở trang';status.classList?.toggle('is-error',Boolean(noticeError));}}

function toggleNotices(){closeAccount();const panel=$('noticePanel');panel.hidden=!panel.hidden;$('noticeBell').setAttribute('aria-expanded',String(!panel.hidden));if(!panel.hidden)pollNotices(true);}
async function markAllNotices(){const ids=noticeItems.filter(n=>!n.read).map(n=>n.id);if(!ids.length)return;try{await rpc('markNoticesRead',token,ids);noticeItems.forEach(n=>n.read=true);renderNotices(0);pollNotices(true);}catch(e){error(e);pollNotices(true);}}
function showAllNotices(){closeNotices();show(`<h2>Thông báo mới nhất</h2><div class="notice-full-list">${noticeMarkup(noticeItems.filter(n=>noticeFilter==='all'||!n.read))}</div>`);}
async function openNotice(id){const n=noticeItems.find(x=>x.id===id);if(!n)return;try{await rpc('markNoticesRead',token,[id]);n.read=true;closeNotices();$('dialog').close();if(n.view==='market')marketKind='COMPANY';view=n.view;homeChosen=true;manageKind='';manageBase='';manageFrom='';manageTo='';await refresh();if(data.swaps?.some(s=>s.id===n.object))swapModal(n.object);else if(n.view==='users'){$('globalError').textContent='Đã mở Quản lý User. Xem mục hỗ trợ mật khẩu hoặc tìm tài khoản liên quan.';}pollNotices(true);}catch(e){error(e);pollNotices(true);}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='hidden')pollNotices(true);});
function login(){stopNotices();closeAccount();$('account').hidden=true;data=null;readCache.clear();document.body.classList.add('is-login');$('nav').innerHTML='';$('identity').textContent='';$('app').innerHTML=`<div class="login-shell"><section class="login-story"><span class="login-tag">Dành cho tổ bay Vietjet</span><h1>Đổi Base phù hợp.<br>Kết nối nguyện vọng.</h1><p class="lead">Đăng ký chuyển Base, tìm người swap và theo dõi phê duyệt tại một nơi.</p><div class="login-steps"><div class="login-step"><b>1</b>Đăng ký nguyện vọng chuyển Base</div><div class="login-step"><b>2</b>Tìm người có Base đối ứng</div><div class="login-step"><b>3</b>Theo dõi đơn và kết quả phê duyệt</div></div></section><section class="panel login"><h2>Chào mừng trở lại</h2><p class="sub">Đăng nhập bằng email đã được cấp quyền.</p><form onsubmit="passwordSignIn(event)" id="passwordForm"><div class="field"><label for="loginEmail">Email</label><input type="email" id="loginEmail" autocomplete="username" placeholder="email@vietjetair.com" required></div><div class="field"><label for="loginPassword">Mật khẩu</label><div class="password-wrap"><input id="loginPassword" type="password" autocomplete="current-password" required placeholder="Nhập mật khẩu"><button class="password-toggle" type="button" onclick="togglePassword()" aria-label="Hiện hoặc ẩn mật khẩu">Hiện</button></div></div><button class="btn primary">Đăng nhập</button></form><div id="passwordHelpLink" class="login-help-row"><button type="button" class="login-help-link" onclick="forgotPasswordModal()">Quên mật khẩu?</button><span>Gửi yêu cầu hỗ trợ reset</span></div><div class="login-method-divider"><span>hoặc chọn cách đăng nhập khác</span></div><button id="loginMethodButton" type="button" class="btn login-method-button" onclick="showOtp()" aria-controls="otpLogin" aria-expanded="false">Đăng nhập bằng mã email</button><div id="otpLogin" class="login-otp-box" hidden><h3>Đăng nhập bằng mã xác minh</h3><p class="sub">Nhận mã dùng một lần qua email công ty. Mật khẩu của bạn không thay đổi.</p><form onsubmit="sendCode(event)"><div class="field"><label for="email">Email nhận mã</label><input type="email" id="email" autocomplete="email" required></div><button class="btn">Gửi mã xác minh</button></form><form onsubmit="signIn(event)" id="otpForm" hidden><div class="field"><label for="otp">Mã xác minh</label><input id="otp" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" required></div><button class="btn primary">Xác minh & đăng nhập</button></form></div><p class="sub status" id="loginMessage"></p><p class="login-foot">Chưa có quyền truy cập hoặc cần hỗ trợ mật khẩu? Liên hệ Super Admin.</p></section></div>`;}

function passwordEyeIcon(visible){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>'+(visible?'<path d="m3 3 18 18"/>':'')+'</svg>';}
function togglePasswordField(id,button){const input=$(id);if(!input)return;const visible=input.type==='password';input.type=visible?'text':'password';button.innerHTML=passwordEyeIcon(visible);button.setAttribute('aria-pressed',String(visible));button.setAttribute('aria-label',visible?'Ẩn mật khẩu':'Hiện mật khẩu');button.title=visible?'Ẩn mật khẩu':'Hiện mật khẩu';}
function togglePassword(){const input=$('loginPassword');input.type=input.type==='password'?'text':'password';document.querySelector('.password-toggle').textContent=input.type==='password'?'Hiện':'Ẩn';}

async function passwordSignIn(e){e.preventDefault();try{const result=await rpc('temporaryLogin',$('loginEmail').value,$('loginPassword').value);token=result.token;sessionStorage.setItem('btToken',token);$('loginPassword').value='';await refresh();}catch(e){error(e);}}

async function sendPasswordHelp(event){event.preventDefault();try{const result=await rpc('requestPasswordHelp',$('helpEmail').value);$('dialog').close();$('loginMessage').textContent=result.message;$('globalError').textContent='';}catch(e){error(e);}}

async function signOut(){stopNotices();try{await rpc('logout',token);}catch(e){}token='';refreshEpoch++;readCache.clear();loadTiming=null;homeChosen=false;aimsRows=[];meImportRows=[];meImportReview=[];meImportChecked=false;marketCompatible=false;dashboardGroup='';dashboardKind='';dashboardFrom='';dashboardTo='';dashboardBase='';dashboardDateField='created';manageKind='';manageBase='';manageFrom='';manageTo='';manageDateField='created';manageKinds=[];manageBases=[];manageStatuses=[];sessionStorage.removeItem('btToken');login();}
function navigationItems(){const primary=[['market','Market']],groups=[];if(data.user.roles.includes('CREW'))primary.push(['mine','Phiếu của tôi'],['swaps','Cặp swap']);if(manager())primary.push(['dashboard','Dashboard'],['manage','Quản lý Đơn']);if(can('HOD_PD','HOD_ROSTERING','HOD_CCD','HOD_FCD'))primary.push(['review','Chờ tôi duyệt']);const operations=[],settings=[];if(can('ADMIN_PD','ADMIN_CCD'))operations.push(['changes','Sửa / hủy']);if(can('ADMIN_CCD','ADMIN_FCD'))operations.push(['aims','Cập nhật AIMS']);if(can('ADMIN_PD','ADMIN_CCD'))operations.push(['crew','Hồ sơ tổ bay']);if(can('SUPER_ADMIN','ADMIN_PD','ADMIN_FOAP'))operations.push(['external','Phê duyệt cấp tiếp theo']);if(can('SUPER_ADMIN','ADMIN_PD'))operations.push(['operations','Email & vận hành'],['import','Import ME']);if(data.user.roles.includes('SUPER_ADMIN'))settings.push(['users','Quản lý User'],['access','Phân quyền']);if(operations.length)groups.push(['Vận hành',operations]);if(settings.length)groups.push(['Cấu hình',settings]);return {primary,groups};}
function closeAccount(){$('accountMenu').hidden=true;$('avatar').setAttribute('aria-expanded','false');}

let pendingAvatar='';
function avatarMarkup(u,avatar=u.avatar||''){return avatar?`<img src="${esc(avatar)}" alt="Ảnh đại diện của ${esc(u.name)}">`:esc(u.name.trim().split(/\s+/).slice(-2).map(n=>n[0]).join('').toUpperCase());}
function myAccount(){closeAccount();const u=data.user;pendingAvatar=u.avatar||'';const role=roleNames[u.roleCode]||u.roleCode||u.roles.join(', '),field=(name,value,wide=false)=>`<div class="profile-field ${wide?'wide':''}"><small>${name}</small><b>${esc(value||'Chưa cập nhật')}</b></div>`;show(`<section class="profile-hero"><div class="profile-photo" id="profilePhoto">${avatarMarkup(u)}</div><div><h2>${esc(u.name)}</h2><span class="pill">${esc(role)}</span><p>My Account · Hồ sơ cá nhân</p></div></section><section class="profile-content"><div class="profile-photo-actions"><input id="avatarFile" type="file" accept="image/jpeg,image/png,image/webp" hidden onchange="previewAvatar(this)"><button class="btn" onclick="document.getElementById('avatarFile').click()">Đổi avatar</button><button class="btn danger" onclick="removeAvatar()">Xóa ảnh</button></div><div class="profile-grid">${field('Email',u.email,true)}${field('VJC-ID',u.vjc)}${field('Phòng ban',u.department)}${u.base?field('Base hiện tại',u.base):''}${field('Vai trò',role)}</div><p id="avatarError" class="error" role="alert" hidden></p><div class="profile-save"><small>JPG, PNG hoặc WebP · tối đa 5 MB.<br>Ảnh được tối ưu trước khi lưu.</small><button class="btn" onclick="ownPasswordModal()">Đổi mật khẩu</button><button class="btn primary" id="saveAvatarButton" onclick="saveAvatar()" disabled>Lưu avatar</button></div></section>`);$('dialog').classList.add('profile-dialog');}
function setAvatarPreview(value){pendingAvatar=value;$('profilePhoto').innerHTML=avatarMarkup(data.user,value);$('saveAvatarButton').disabled=pendingAvatar===(data.user.avatar||'');$('avatarError').hidden=true;}
function removeAvatar(){setAvatarPreview('');$('avatarFile').value='';}
async function previewAvatar(input){const file=input.files?.[0];if(!file)return;try{if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024)throw Error('Chọn ảnh JPG, PNG hoặc WebP, tối đa 5 MB.');const url=URL.createObjectURL(file);try{const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(Error('Không đọc được ảnh.'));image.src=url;});const canvas=document.createElement('canvas');canvas.width=canvas.height=128;const ctx=canvas.getContext('2d'),size=Math.min(image.naturalWidth,image.naturalHeight);ctx.drawImage(image,(image.naturalWidth-size)/2,(image.naturalHeight-size)/2,size,size,0,0,128,128);let avatar=canvas.toDataURL('image/jpeg',.8);if(avatar.length>45000)avatar=canvas.toDataURL('image/jpeg',.55);if(avatar.length>45000)throw Error('Ảnh quá lớn sau khi tối ưu. Chọn ảnh khác.');setAvatarPreview(avatar);}finally{URL.revokeObjectURL(url);}}catch(e){$('avatarError').textContent=e.message;$('avatarError').hidden=false;}}
async function saveAvatar(){try{await rpc('updateAvatar',token,pendingAvatar);$('dialog').close();await refresh();}catch(e){$('avatarError').textContent=e.message;$('avatarError').hidden=false;}}

document.addEventListener('click',e=>{if(!$('account').contains(e.target))closeAccount();document.querySelectorAll('.nav-group[open]').forEach(el=>{if(!el.contains(e.target))el.open=false;});});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeAccount();document.querySelectorAll('.nav-group[open]').forEach(el=>el.open=false);}});
function render(){document.body.classList.remove('is-login');if(!homeChosen){view=defaultView();homeChosen=true;}const {primary,groups}=navigationItems(),available=[...primary,...groups.flatMap(([,items])=>items)];if(!available.some(([v])=>v===view))view=defaultView();const button=([v,n])=>`<button class="${view===v?'active':''}" ${view===v?'aria-current="page"':''} onclick="nav(${js(v)})">${n}</button>`;$('nav').classList.toggle('open',menuOpen);$('menu').setAttribute('aria-expanded',String(menuOpen));$('nav').innerHTML=primary.map(button).join('')+groups.map(([name,items])=>`<details class="nav-group ${items.some(([v])=>v===view)?'active':''}"><summary>${name}</summary><div class="nav-group-menu">${items.map(button).join('')}</div></details>`).join('');$('account').hidden=false;$('avatar').innerHTML=avatarMarkup(data.user);$('identity').innerHTML=`<b>${esc(data.user.name)}</b><small>${esc(data.user.email)}</small><small>${esc((roleNames[data.user.roleCode]||data.user.roleCode||data.user.roles.join(', '))+' · '+data.user.department)}</small>`;$('app').innerHTML=pages[view]();prepareTables($('app'));startNotices();}

function head(title,sub,action=''){return `<div class="row between" style="margin-bottom:20px"><div><h1>${title}</h1><p class="sub">${sub}</p></div>${action}</div>`;}const empty=()=>'<div class="empty">Chưa có dữ liệu phù hợp.</div>';
function requestDetail(id){const r=data.market.find(x=>x.id===id);if(!r)return;show(`<h2>${esc(r.name)}</h2><p class="sub">VJC-ID ${esc(r.vjc)} · ${esc(r.id)}</p><div class="route">${esc(r.from)} → ${esc(r.to)}</div><p>Tháng chuyển: ${esc(r.month)}</p><p>Từ ${date(r.start)} đến ${r.end?date(r.end):'Không xác định thời hạn'}</p><p>${esc(r.reason)}</p>${pill(r.status)}`);}
function card(r){return `<article class="card"><div class="row between"><small>${esc(r.legacy||r.id.slice(0,12))}</small>${pill(r.status)}</div><div class="route">${esc(r.from)} → ${esc(r.to)}</div><h3>${esc(r.name)}</h3><p class="sub">${kindName(r.requestKind)} · ${esc(r.crewGroup||'CCD')} · ${esc(r.jobTitle||'Chưa xác nhận chức danh')}${r.cycle?' · '+esc(r.cycle)+' / '+esc(r.batch):''}</p><p class="sub">VJC-ID ${esc(r.vjc)} · Tháng ${esc(r.month)}</p><p>Từ ${date(r.start)}<br>Đến ${r.end?date(r.end):'Không xác định thời hạn'}</p><p class="sub">Tạo ${date(r.created)}${r.source==='ME'?' · Nhập từ ME':' · Nhắc email mỗi 14 ngày'}</p>${data.user.roles.includes('CREW')?`<p class="sub">${r.canSwap?'✓ Phù hợp với bạn':esc(r.swapReason||'Chưa đủ điều kiện ghép')}</p>`:''}${r.canSwap===true?`<button class="btn primary" onclick="matchModal(${js(r.id)})">Xem & chọn swap</button>`:`<button class="btn" onclick="requestDetail(${js(r.id)})">Xem chi tiết</button>`}</article>`;}
function market(){if(marketKind==='COMPANY')return companyMarketPage();const list=data.market;return head('Market',marketKind==='COMPANY'?'Chọn người cùng chức danh, cùng vòng và khác đợt. Người được chọn cần xác nhận.':'Chọn Base đối ứng và thời gian trùng nhau.',data.user.roles.includes('CREW')&&allowed('REQUEST_CREATE')&&marketKind==='PERSONAL'?'<button class="btn primary" onclick="requestModal()">Đăng ký chuyển Base</button>':'')+`<section class="panel"><div class="row" role="tablist" aria-label="Loại yêu cầu"><button role="tab" aria-selected="${marketKind==='PERSONAL'}" class="btn ${marketKind==='PERSONAL'?'primary':''}" onclick="setMarketKind('PERSONAL')">Theo nguyện vọng</button><button role="tab" aria-selected="${marketKind==='COMPANY'}" class="btn ${marketKind==='COMPANY'?'primary':''}" onclick="setMarketKind('COMPANY')">Theo phân công Công ty</button></div><div class="twocol" style="margin-top:16px">${!data.user.roles.includes('CREW')?`<div class="field"><label for="marketCrewGroup">Nhóm tổ bay</label><select id="marketCrewGroup" onchange="marketGroup=this.value;reloadMarket()"><option value="">Tất cả</option><option value="CCD" ${marketGroup==='CCD'?'selected':''}>CCD · Tiếp viên</option><option value="PILOT" ${marketGroup==='PILOT'?'selected':''}>Pilot</option></select></div>`:`<p>${esc(data.user.crewGroup)} · ${esc(data.user.jobTitle||'Chưa xác nhận chức danh')} · Base ${esc(data.user.base)}</p>`}${marketKind==='COMPANY'?`<div class="field"><label>Vòng chuyển căn cứ</label><input value="${esc(marketCycle)}" onchange="marketCycle=this.value.trim();reloadMarket()"></div><div class="field"><label>Đợt</label><input value="${esc(marketBatch)}" onchange="marketBatch=this.value.trim();reloadMarket()"></div><div class="field"><label>Chức danh</label><input value="${esc(marketJob)}" onchange="marketJob=this.value.trim().toUpperCase();reloadMarket()"></div>`:''}</div><input class="filters" aria-label="Tìm kiếm Market" placeholder="Tên, VJC-ID, Base, tháng…" value="${esc(query)}" onchange="searchMarket(this.value)"></section>${data.user.roles.includes('CREW')?`<label class="check"><input type="checkbox" ${marketCompatible?'checked':''} onchange="marketCompatible=this.checked;reloadMarket()">Chỉ hiện người phù hợp với tôi</label>`:''}${offerPanel()}<div class="grid">${list.map(card).join('')||marketEmpty()}</div>${pager(data.marketMeta,'market')}`;}
function reqTable(rows,owner){return `<div class="tablewrap"><table><thead><tr><th>Tổ bay</th><th>Base</th><th>Thời gian</th><th>Trạng thái</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}<small>${kindName(r.requestKind)} · ${esc(r.crewGroup||'CCD')}</small><small>${esc(r.vjc)} · ${esc(r.id)}</small></td><td>${esc(r.from)} → ${esc(r.to)}</td><td>${date(r.start)}<small>${r.end?date(r.end):'Không xác định thời hạn'}</small></td><td>${pill(r.status)}<small>${esc(nextStep(r))}</small></td><td>${owner&&r.status==='OPEN'&&r.requestKind!=='COMPANY'?`<button class="btn" onclick="requestModal(${js(r.id)})">Sửa</button> <button class="btn danger" onclick="cancelReq(${js(r.id)})">Hủy</button>`:''}</td></tr>`).join('')}</tbody></table></div>`;}
function mine(){const rs=data.requests.filter(r=>r.vjc===data.user.vjc);return head('Phiếu của tôi','Sửa/hủy trước khi ghép. Sau khi ghép cần hai tiếp viên xác nhận.', '<button class="btn primary" onclick="requestModal()">Đăng ký</button>')+`<section class="panel">${rs.length?reqTable(rs,true):empty()}</section>`;}
function meInfo(s){if(!s.me)return '';const names={QUEUED:'Đang chờ tạo ticket',SYNC_PENDING:'Chờ đồng bộ',VERIFYING:'Đang kiểm tra ticket',SYNCED:'Đã đồng bộ',CLOSED:'Ticket đã Closed',FAILED:'Đồng bộ lỗi',UNCERTAIN:'Cần kiểm tra kết quả tạo'};return `<small>ME ${/^\d+$/.test(s.me.ticket||'')?'#'+esc(s.me.ticket)+' · ':''}${esc(names[s.me.state]||s.me.state)}${s.me.error?' · '+esc(s.me.error):''}</small>`;}
function swapTable(rows){return `<div class="tablewrap"><table><thead><tr><th>Cặp</th><th>Hai thành viên tổ bay</th><th>Base / tháng</th><th>Trạng thái</th><th></th></tr></thead><tbody>${rows.map(s=>`<tr><td>${esc(s.id.slice(0,12))}<small>${kindName(s.requestKind)} · ${esc(s.crewGroup||'CCD')}</small><small>Phiên bản ${s.version}</small></td><td>${esc(s.a.name)}<small>${esc(s.b.name)}</small></td><td>${esc(s.a.from)} ↔ ${esc(s.b.from)}<small>${esc(s.a.month)}</small></td><td>${pill(s.status)}<small>${esc(nextStep(s))}</small>${meInfo(s)}</td><td><button class="btn" onclick="swapModal(${js(s.id)})">Chi tiết</button></td></tr>`).join('')}</tbody></table></div>`;}
function swaps(){return head('Cặp swap','Theo dõi bước duyệt, phê duyệt cấp tiếp theo và cập nhật AIMS.')+orderFilters()+`<section class="panel">${data.swaps.filter(orderWhere).length?swapTable(data.swaps.filter(orderWhere)):empty()}</section>`;}
function review(){const ss=data.swaps.filter(s=>s.workflow?pendingFlowRoles(s).some(r=>can(r)):can(({PENDING_PD:'HOD_PD',PENDING_ROSTERING:'HOD_ROSTERING',PENDING_CCD:'HOD_CCD',PENDING_FCD:'HOD_FCD'})[s.status]||'NONE')&&s.status.startsWith('PENDING_')&&['PENDING_PD','PENDING_ROSTERING','PENDING_CCD','PENDING_FCD'].includes(s.status));return head('Đơn đến lượt duyệt','HOD xem dashboard; chỉ duyệt ở bước của phòng ban mình.')+orderFilters()+`<section class="panel">${ss.filter(orderWhere).length?swapTable(ss.filter(orderWhere)):empty()}</section>`;}
let manageTab='requests';
function setManageTab(tab){manageTab=tab;manageKind='';manageBase='';manageKinds=[];manageBases=[];manageStatuses=[];render();}
function manage(){const tabs=can('ADMIN_PD','ADMIN_CCD')?`<section class="panel"><div class="row" role="tablist" aria-label="Quản lý đơn"><button role="tab" aria-selected="${manageTab==='requests'}" class="btn ${manageTab==='requests'?'primary':''}" onclick="setManageTab('requests')">Đơn yêu cầu</button><button role="tab" aria-selected="${manageTab==='company'}" class="btn ${manageTab==='company'?'primary':''}" onclick="setManageTab('company')">Danh sách thuyên chuyển Công ty</button>${can('ADMIN_PD')?`<button class="btn ${manageTab==='reserve'?'primary':''}" onclick="setManageTab('reserve')">Danh sách dự bị</button>`:''}</div></section>`:'';if(['company','reserve'].includes(manageTab)&&can('ADMIN_PD','ADMIN_CCD'))return head('Quản lý Đơn','Quản lý yêu cầu và cập nhật danh sách theo policy Công ty.')+tabs+companyPage();return head('Quản lý Đơn','Phiếu gốc, cặp swap và lịch sử được lưu trong hệ thống.')+tabs+orderFilters()+`<section class="panel">${data.requests.filter(orderWhere).length?reqTable(data.requests.filter(orderWhere),false):empty()}</section>`;}
let dashboardGroup='',dashboardKind='',dashboardFrom='',dashboardTo='',dashboardBase='',dashboardDateField='created';
function recordDay(value){const raw=String(value||'');if(!raw)return '';if(/^\d{4}-\d{2}-\d{2}$/.test(raw))return raw;const dt=new Date(raw);if(isNaN(dt.getTime()))return '';const p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(dt).map(x=>[x.type,x.value]));return p.year+'-'+p.month+'-'+p.day;}
function recordDate(r,field){return recordDay(field==='start'?(r.start||r.a?.start):field==='approved'?(r.approvedAt||r.externalApproval?.at):r.created);}
function recordHasBase(r,base){return !base||[r.from,r.to,r.a?.from,r.a?.to,r.b?.from,r.b?.to].includes(base);}
function inDateRange(r,field,from,to){const day=recordDate(r,field);return (!from&&!to&&field!=='approved')||!!day&&(!from||day>=from)&&(!to||day<=to);}
function dashboardWhere(r){return (!dashboardGroup||(r.crewGroup||'CCD')===dashboardGroup)&&(!dashboardKind||(r.requestKind||'PERSONAL')===dashboardKind)&&recordHasBase(r,dashboardBase)&&inDateRange(r,dashboardDateField,dashboardFrom,dashboardTo);}
let manageBase='',manageFrom='',manageTo='',manageDateField='created';
let manageStatuses=[];
function orderWhere(r){return (!manageStatuses.length||manageStatuses.includes(r.status))&&(!manageKinds.length||manageKinds.includes(r.requestKind||'PERSONAL'))&&(!manageKind||(r.requestKind||'PERSONAL')===manageKind)&&(!manageBases.length||manageBases.some(b=>recordHasBase(r,b)))&&recordHasBase(r,manageBase)&&inDateRange(r,manageDateField,manageFrom,manageTo);}
function setOrderDate(which,value){const from=which==='from'?value:manageFrom,to=which==='to'?value:manageTo;if(from&&to&&from>to){error(Error('Từ ngày phải trước hoặc bằng đến ngày.'));render();return;}manageFrom=from;manageTo=to;render();}
let manageKinds=[],manageBases=[];
function multiFilter(id,label,options,selected){const chosen=options.filter(([k])=>selected.includes(k)),caption=chosen.length?chosen.slice(0,2).map(([,v])=>v).join(', ')+(chosen.length>2?' +'+(chosen.length-2):''):'Tất cả';return `<div class="field"><label>${esc(label)}</label><details class="multi-filter" id="${id}"><summary aria-label="${esc(label)}: ${esc(caption)}"><span>${esc(caption)}</span><b>${selected.length||'⌄'}</b></summary><div class="multi-menu"><input type="search" aria-label="Tìm ${esc(label)}" placeholder="Tìm lựa chọn…" oninput="searchMulti('${id}',this.value)"><div class="multi-tools"><button type="button" onclick="setMulti('${id}',${js(options.map(([k])=>k))})">Chọn tất cả</button><button type="button" onclick="setMulti('${id}',[])">Bỏ chọn</button></div>${options.map(([k,v])=>`<label class="multi-option"><input type="checkbox" ${selected.includes(k)?'checked':''} onchange="toggleMulti('${id}',${js(k)},this.checked)"><span>${esc(v)}</span></label>`).join('')}</div></details></div>`;}
function multiValues(id){return id==='kindMulti'?manageKinds:id==='baseMulti'?manageBases:manageStatuses;}
function setMulti(id,values){if(id==='kindMulti'){manageKinds=values;manageKind='';}else if(id==='baseMulti'){manageBases=values;manageBase='';}else manageStatuses=values;const open=[...document.querySelectorAll('.multi-filter[open]')].map(n=>n.id);render();open.forEach(k=>{if($(k))$(k).open=true;});}
function toggleMulti(id,key,checked){const v=multiValues(id);setMulti(id,checked?[...new Set([...v,key])]:v.filter(k=>k!==key));}
function searchMulti(id,value){const q=value.trim().toLowerCase();$(id).querySelectorAll('.multi-option').forEach(n=>n.hidden=!n.textContent.toLowerCase().includes(q));}
function resetOrderFilters(){manageKind='';manageBase='';manageKinds=[];manageBases=[];manageStatuses=[];manageFrom='';manageTo='';manageDateField='created';render();}
function orderFilters(){const statusOptions=[...new Set((view==='manage'&&manageTab==='company'?data.assignments.filter(r=>!['RESERVE','DELETED','CANCELLED'].includes(r.Status)):[...data.requests,...data.swaps]).map(r=>r.status))].sort().map(k=>[k,labels[k]||k]),chips=[...manageKinds.map(k=>['kindMulti',k,kindName(k)]),...manageStatuses.map(k=>['statusMulti',k,labels[k]||k]),...manageBases.map(k=>['baseMulti',k,k])];return `<section class="panel filter-panel"><div class="row between"><div><h2>Bộ lọc đơn</h2><p class="sub">Chọn nhiều giá trị trong mỗi bộ lọc</p></div><button class="btn" onclick="resetOrderFilters()">Xóa bộ lọc</button></div><div class="filter-grid">${multiFilter('kindMulti','Loại yêu cầu',['PERSONAL','COMPANY'].map(k=>[k,kindName(k)]),manageKinds)}${multiFilter('statusMulti','Trạng thái',statusOptions,manageStatuses)}${multiFilter('baseMulti','Base liên quan',data.bases.map(k=>[k,k]),manageBases)}<div class="field"><label for="orderDateField">Lọc theo ngày</label><select id="orderDateField" onchange="manageDateField=this.value;render()"><option value="created" ${manageDateField==='created'?'selected':''}>Ngày tạo đơn</option><option value="start" ${manageDateField==='start'?'selected':''}>Ngày điều chuyển</option></select></div><div class="field"><label for="orderFrom">Từ ngày</label><input id="orderFrom" type="date" value="${esc(manageFrom)}" onchange="setOrderDate('from',this.value)"></div><div class="field"><label for="orderTo">Đến ngày</label><input id="orderTo" type="date" value="${esc(manageTo)}" onchange="setOrderDate('to',this.value)"></div></div>${chips.length?`<div class="filter-chips">${chips.map(([id,k,v])=>`<button onclick="toggleMulti('${id}',${js(k)},false)" aria-label="Bỏ ${esc(v)}">${esc(v)} <span>×</span></button>`).join('')}</div>`:''}<small class="sub">Không chọn = Tất cả. Base liên quan gồm Base đi hoặc đến của một trong hai thành viên.</small></section>`;}

function dashboardModel(){const requests=data.requests.filter(dashboardWhere),swaps=data.swaps.filter(dashboardWhere);if(!dashboardGroup&&!dashboardKind&&!dashboardFrom&&!dashboardTo&&!dashboardBase&&dashboardDateField==='created')return {requests,swaps,summary:data.summary||{}};const from=Object.fromEntries(data.bases.map(b=>[b,0])),routes={},byKind={PERSONAL:{open:0,waiting:0,approved:0,completed:0,cancelled:0},COMPANY:{open:0,waiting:0,approved:0,completed:0,cancelled:0}};requests.filter(r=>r.status==='OPEN').forEach(r=>{from[r.from]=(from[r.from]||0)+1;const route=r.from+' → '+r.to;routes[route]=(routes[route]||0)+1;if(byKind[r.requestKind||'PERSONAL'])byKind[r.requestKind||'PERSONAL'].open++;});swaps.forEach(r=>{const g=byKind[r.requestKind||'PERSONAL'];if(g)g[r.status==='COMPLETED'?'completed':r.status==='CANCELLED'?'cancelled':r.status==='PENDING_AIMS'?'approved':'waiting']++;});return {requests,swaps,summary:{open:requests.filter(r=>r.status==='OPEN').length,pending:swaps.filter(r=>!['COMPLETED','CANCELLED','PENDING_AIMS'].includes(r.status)).length,aims:swaps.filter(r=>r.status==='PENDING_AIMS').length,completed:swaps.filter(r=>r.status==='COMPLETED').length,from,routes,byKind,returns:(data.summary?.returns||[]).filter(r=>swaps.some(s=>s.id===r.swap))}};}
function dashboardFilters(){return `<section class="panel" aria-label="Bộ lọc Dashboard"><h2>Bộ lọc Dashboard</h2><div class="filter-grid"><div class="field"><label for="dashboardGroup">Nhóm tổ bay</label><select id="dashboardGroup" onchange="dashboardGroup=this.value;render()"><option value="">Tất cả nhóm được cấp quyền</option>${[['CCD','CCD · Tiếp viên'],['PILOT','Pilot']].map(([k,v])=>`<option value="${k}" ${dashboardGroup===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label for="dashboardKind">Loại yêu cầu</label><select id="dashboardKind" onchange="dashboardKind=this.value;render()"><option value="">Tất cả</option>${['PERSONAL','COMPANY'].map(k=>`<option value="${k}" ${dashboardKind===k?'selected':''}>${kindName(k)}</option>`).join('')}</select></div><div class="field"><label for="dashboardBase">Base liên quan</label><select id="dashboardBase" onchange="dashboardBase=this.value;render()"><option value="">Tất cả Base</option>${data.bases.map(b=>`<option ${dashboardBase===b?'selected':''}>${b}</option>`).join('')}</select></div><div class="field"><label for="dashboardDateField">Lọc theo ngày</label><select id="dashboardDateField" onchange="dashboardDateField=this.value;render()">${[['created','Ngày tạo đơn'],['start','Ngày bắt đầu chuyển Base'],['approved','Ngày duyệt hoàn tất']].map(([v,label])=>`<option value="${v}" ${dashboardDateField===v?'selected':''}>${label}</option>`).join('')}</select></div><div class="field"><label for="dashboardFrom">Từ ngày</label><input id="dashboardFrom" type="date" value="${esc(dashboardFrom)}" onchange="setDashboardDate('from',this.value)"></div><div class="field"><label for="dashboardTo">Đến ngày</label><input id="dashboardTo" type="date" value="${esc(dashboardTo)}" onchange="setDashboardDate('to',this.value)"></div></div><button class="btn" onclick="dashboardGroup='';dashboardKind='';dashboardFrom='';dashboardTo='';dashboardBase='';dashboardDateField='created';render()">Bỏ bộ lọc Dashboard</button><p class="sub">Khoảng ngày bao gồm cả ngày đầu và ngày cuối, theo giờ Việt Nam. Base liên quan là Base đi hoặc đến. Lịch sử ME chưa đối chiếu không nằm trong số liệu này.</p></section>`;}
function setDashboardDate(which,value){const from=which==='from'?value:dashboardFrom,to=which==='to'?value:dashboardTo;if(from&&to&&from>to){error(Error('Ngày tạo từ phải trước hoặc bằng ngày tạo đến.'));render();return;}dashboardFrom=from;dashboardTo=to;render();}
function dashboardList(status){const m=dashboardModel(),rows=status==='open'?m.requests.filter(r=>r.status==='OPEN'):m.swaps.filter(s=>status==='aims'?s.status==='PENDING_AIMS':status==='completed'?s.status==='COMPLETED':!['COMPLETED','CANCELLED','PENDING_AIMS'].includes(s.status));show(`<h2>${{open:'Phiếu đang tìm Swap',pending:'Cặp chờ xử lý',aims:'Cặp chờ AIMS',completed:'Cặp hoàn tất'}[status]}</h2>${rows.length?(status==='open'?reqTable(rows,false):swapTable(rows)):'<p>Chưa có đơn theo bộ lọc này.</p>'}`);}
function dashboard(){const m=dashboardModel(),summary=m.summary;return head('Dashboard tổng thể','Theo dõi nhu cầu, phê duyệt và cập nhật AIMS.')+dashboardFilters()+`<div class="stats">${[['Đang tìm Swap',summary.open||0,'open','phiếu'],['Chờ xử lý',summary.pending||0,'pending','cặp'],['Chờ AIMS',summary.aims||0,'aims','cặp'],['Hoàn tất',summary.completed||0,'completed','cặp']].map(([n,v,k,unit])=>`<button class="stat" onclick="dashboardList('${k}')" aria-label="${n} · ${v} ${unit}"><span class="sub">${n}</span><b>${v}</b><small>${unit}</small></button>`).join('')}</div>${dashboardDateField==='approved'?`<p class="sub">${data.swaps.filter(s=>['PENDING_AIMS','COMPLETED'].includes(s.status)&&!recordDate(s,'approved')).length} cặp đã duyệt chưa có ngày duyệt xác thực; được loại khỏi bộ lọc ngày duyệt.</p>`:''}${kindChart(summary.byKind)}<div class="dashboard-charts"><section class="panel"><h2>Nhu cầu theo Base hiện tại</h2><p class="sub">Phiếu đang tìm Swap theo bộ lọc. Chọn một phần biểu đồ để xem số lượng và tỷ trọng.</p>${baseDeparturePie([],data.bases,summary.from||{})}</section><section class="panel"><h2>Nhu cầu theo tuyến chuyển Base</h2><p class="sub">Các tuyến như SGN → DAD, SGN → HAN. Bao gồm phiếu Web và phiếu ME đã nhập vào DB, áp dụng cùng bộ lọc.</p>${pie([],summary.routes||{})}</section></div><section class="panel"><h2>Hàng đợi</h2>${m.swaps.some(s=>!['COMPLETED','CANCELLED'].includes(s.status))?swapTable(m.swaps.filter(s=>!['COMPLETED','CANCELLED'].includes(s.status))):'<p class="empty">Không có cặp chờ xử lý theo bộ lọc này.</p>'}</section><section class="panel"><h2>Lịch trở về căn cứ chính</h2>${(summary.returns||[]).map(r=>`<p>${esc(r.name)} · ${date(r.date)} · ${esc(r.mainBase||'Cần đối chiếu căn cứ chính')} ${r.due?'· Đến hạn':''}</p>`).join('')||'<p class="empty">Chưa có lịch trở về từ các cặp đã hoàn tất.</p>'}</section>`;}

function baseDeparturePie(requests,bases,aggregate){const counts=new Map([...new Set([...bases,...requests.map(r=>r.from)])].map(b=>[b,0]));requests.forEach(r=>counts.set(r.from,counts.get(r.from)+1));if(aggregate)Object.entries(aggregate).forEach(([b,n])=>counts.set(b,n));return interactivePie([...counts.entries()],'departure','Base hiện tại','Phiếu chuyển đi theo Base');}
function pie(rs,aggregate){const g={...(aggregate||{})};rs.forEach(r=>{const k=r.from+' → '+r.to;g[k]=(g[k]||0)+1;});return interactivePie(Object.entries(g),'routes','Tuyến chuyển','Nhu cầu theo tuyến chuyển');}
function interactivePie(entries,id,heading,title){const colors=['#df1d32','#ffcf24','#94172b','#e99715','#e98592','#bd8720'],total=entries.reduce((sum,[,n])=>sum+n,0),positive=entries.filter(([,n])=>n>0),percent=n=>total?(100*n/total).toFixed(1)+'%':'0.0%';let angle=-Math.PI/2;const segments=entries.map(([name,n],i)=>{if(!n)return '';const start=angle;angle+=2*Math.PI*n/total;const mid=(start+angle)/2,dx=+(14*Math.cos(mid)).toFixed(2),dy=+(14*Math.sin(mid)).toFixed(2),color=colors[i%colors.length],label=esc(name+' · '+n+' phiếu · '+percent(n)),shape=positive.length===1?`<circle cx="120" cy="120" r="96" fill="${color}"/>`:`<path d="M120 120 L${120+96*Math.cos(start)} ${120+96*Math.sin(start)} A96 96 0 ${n/total>.5?1:0} 1 ${120+96*Math.cos(angle)} ${120+96*Math.sin(angle)} Z" fill="${color}" stroke="white" stroke-width="2"/>`;return `<g class="pie-slice" role="button" tabindex="0" aria-pressed="false" aria-label="${label}" data-pie-index="${i}" style="--slice-x:${positive.length===1?0:dx}px;--slice-y:${positive.length===1?-6:dy}px" onclick="selectPie(this,${i})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectPie(this,${i})}"><title>${label}</title>${shape}${n/total>=.045?`<text x="${positive.length===1?120:120+62*Math.cos(mid)}" y="${positive.length===1?120:120+62*Math.sin(mid)}" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="750" fill="${i%colors.length===1||i%colors.length===3||i%colors.length===5?'#501020':'white'}" pointer-events="none">${percent(n)}</text>`:''}</g>`;}).join('');return `<div class="pie interactive-pie" id="pie-${id}"><div class="pie-visual"><svg viewBox="0 0 240 240" role="group" aria-label="${esc(title)}">${total?segments:'<circle cx="120" cy="120" r="96" fill="#eee5e7"/><text x="120" y="125" text-anchor="middle" fill="#756975">Chưa có phiếu</text>'}</svg><div class="pie-detail" aria-live="polite"><span class="sub">${total?'Chọn một múi hoặc tên trong bảng để xem chi tiết.':'Chưa có phiếu đang tìm swap.'}</span></div></div><div class="tablewrap"><table><thead><tr><th>${heading}</th><th>Số phiếu</th><th>Tỷ trọng</th></tr></thead><tbody>${entries.map(([name,n],i)=>`<tr data-pie-row="${i}"><td><button class="pie-key" onclick="selectPie(this,${i})" data-pie-name="${esc(name)}" data-pie-count="${n}" data-pie-percent="${percent(n)}" aria-pressed="false"><span class="dot" style="background:${colors[i%colors.length]}"></span>${esc(name)}</button></td><td><b>${n}</b></td><td>${percent(n)}</td></tr>`).join('')}</tbody><tfoot><tr><th>Tổng cộng</th><th>${total}</th><th>${total?'100':'0'}%</th></tr></tfoot></table></div></div>`;}
function selectPie(element,index){const chart=element.closest('.interactive-pie'),key=chart.querySelectorAll('.pie-key')[index];if(!key)return;chart.querySelectorAll('.pie-slice').forEach(slice=>{const selected=Number(slice.dataset.pieIndex)===index;slice.classList.toggle('selected',selected);slice.setAttribute('aria-pressed',String(selected));});chart.querySelectorAll('[data-pie-row]').forEach(row=>{const selected=Number(row.dataset.pieRow)===index;row.classList.toggle('selected',selected);row.querySelector('button').setAttribute('aria-pressed',String(selected));});const selectedSlice=chart.querySelector('.pie-slice.selected');if(selectedSlice)selectedSlice.parentNode.appendChild(selectedSlice);chart.querySelector('.pie-detail').innerHTML=`<b>${esc(key.dataset.pieName)}</b><div><strong>${esc(key.dataset.pieCount)}</strong> phiếu <span class="pill">${esc(key.dataset.piePercent)}</span></div>`;}

function prepareTables(root){for(const table of root.querySelectorAll('table')){const wide=(table.rows[0]?.cells.length||0)>3;table.classList.toggle('wide-table',wide);if(table.closest('.tablewrap'))continue;const wrap=document.createElement('div');wrap.className='tablewrap';wrap.tabIndex=0;wrap.setAttribute('role','region');wrap.setAttribute('aria-label','Danh sách có thể cuộn ngang');table.before(wrap);wrap.append(table);const hint=document.createElement('p');hint.className='table-hint';hint.textContent='Vuốt ngang để xem thêm cột';hint.hidden=!wide;wrap.prepend(hint);}}
function show(body){const dialog=$('dialog'),content=$('dialogBody');dialog.classList.remove('profile-dialog','pair-dialog');dialog.querySelectorAll('[data-dialog-action]').forEach(n=>n.remove());content.innerHTML=body;prepareTables(content);content.querySelectorAll(':scope > button.btn.primary,:scope > button.btn.danger,:scope > .row').forEach(n=>{if(n.matches('.row')&&!n.querySelector('button.btn.primary'))return;n.dataset.dialogAction='true';const footer=dialog.querySelector('.footer');footer.insertBefore(n,footer.lastElementChild);});dialog.showModal();}
function fields(r={}){return `<div class="twocol"><div class="field"><label>Base muốn chuyển</label><select id="target">${data.bases.filter(b=>b!==data.user.base).map(b=>`<option ${r.to===b?'selected':''}>${b}</option>`).join('')}</select></div><div class="field"><label>Tháng chuyển</label><input id="month" type="month" value="${esc(r.month||'')}"></div><div class="field"><label>Ngày bắt đầu</label><input id="start" type="date" value="${esc(r.start||'')}"></div><div class="field"><label>Ngày kết thúc (để trống nếu không xác định)</label><input id="end" type="date" value="${esc(r.end||'')}"></div></div><div class="field"><label>Lý do</label><textarea id="reason">${esc(r.reason||'')}</textarea></div>`;}
function requestModal(id,mode='PERSONAL'){const r=data.requests.find(r=>r.id===id);if(!id&&mode==='COMPANY')return companySwapModal();const own=(data.companyList||[]).find(x=>x.vjc===data.user.vjc&&x.status==='PUBLISHED'),blocked=!id&&hasOpenApplication();show(`<h2>${r?'Sửa phiếu':'Đăng ký chuyển Base'}</h2>${!r?'<div class="field"><label for="registrationType">Loại đăng ký</label><select id="registrationType" onchange="requestModal(null,this.value)"><option value="PERSONAL">Theo nguyện vọng</option><option value="COMPANY">Đổi Base được phân công</option></select></div>':''}<p>${esc(data.user.name)} · ${esc(data.user.vjc)}</p><div class="field"><label>Current Base (theo hồ sơ)</label><input value="${esc(data.user.base)}" readonly></div>${blocked?`<div class="info">Bạn đã có đơn hoặc phân công đang xử lý; không thể tạo thêm đơn nguyện vọng.${own?' Chọn “Đổi Base được phân công” để đề nghị đổi Base đích.':''}</div>`:`${fields(r)}<label class="check"><input id="consent" type="checkbox">Tôi đồng ý để người phù hợp chọn swap và tạo cặp ngay, không cần tôi xác nhận lại.</label><button class="btn primary" onclick="saveReq(${js(id||'')})">Lưu</button>`}`);}

let mutationPending=false;
async function act(action,a){if(mutationPending)return null;mutationPending=true;try{const result=await rpc('mutate',token,action,{...a,op:crypto.randomUUID()});$('dialog').close();await refresh();mailDeliveryFeedback(result.emailDelivery);return result;}catch(e){error(e);return null;}finally{mutationPending=false;}}
async function saveReq(id){if(!$('consent').checked)return error(Error('Cần xác nhận đồng ý swap.'));await act(id?'editRequest':'create',{id,to:$('target').value,month:$('month').value,start:$('start').value,end:$('end').value,reason:$('reason').value});}

function matchModal(id){const r=data.market.find(r=>r.id===id);if(!r||r.canSwap!==true)return;const own=data.requests.find(p=>p.vjc===data.user.vjc&&p.status==='OPEN'&&(p.requestKind||'PERSONAL')===(r.requestKind||'PERSONAL'));show(`<h2>${r.requestKind==='COMPANY'?'Đề nghị hoán đổi lịch':'Xác nhận chọn swap'}</h2>${person(r)}${own?person(own):'<p>Phiếu đối ứng sẽ lấy thời gian của phiếu được chọn.</p>'}<p>${r.requestKind==='COMPANY'?'Hai người đổi vị trí/lịch phân công. Đơn chung chỉ được tạo sau khi người còn lại đồng ý.':'Hai phiếu phải đối xứng Base và trùng ngày.'}</p><label class="check"><input id="matchConsent" type="checkbox">Tôi đã xem lịch của hai bên và đồng ý.</label><button class="btn primary" onclick="doMatch(${js(id)})">${r.requestKind==='COMPANY'?'Gửi đề nghị':'Xác nhận swap'}</button>`);}

function person(p){return `<section class="panel"><h3>${esc(p.name)}</h3><p class="sub">${esc(p.jobTitle||'')} ${p.cycle?'· '+esc(p.cycle)+' / '+esc(p.batch):''}</p><p class="sub">${esc(p.vjc)} · ${esc(p.email)}</p><div class="route">${esc(p.from)} → ${esc(p.to)}</div><p>${date(p.start)} đến ${p.end?date(p.end):'Không xác định thời hạn'}</p></section>`;}
function pairComparison(a={},b={}){a=a||{};b=b||{};const value=v=>v?esc(v):'—',day=v=>v?date(v):'—',fields=p=>[['VJCID',value(p.vjc)],['Email',value(p.email)],['Chức danh',value(p.jobTitle)],['Base đi → Base đến',`${value(p.from)} → ${value(p.to)}`],['Từ ngày',day(p.start)],['Đến ngày',p.end?day(p.end):p.start?'Không xác định thời hạn':'—'],['Lý do',value(p.reason)],['Phân công',p.cycle?`${value(p.cycle)} / ${value(p.batch)}`:'—']];return `<div class="pair-cards">${[a,b].map((p,i)=>`<section class="panel pair-card"><h3><span class="pair-person-label">Thành viên ${i?'B':'A'}</span>${value(p.name)}</h3>${fields(p).map(([label,v])=>`<dl class="pair-field"><dt>${label}</dt><dd>${v}</dd></dl>`).join('')}</section>`).join('')}</div>`;}

function swapModal(id){const s=data.swaps.find(s=>s.id===id),stageRole=s.workflow?pendingFlowRoles(s).find(r=>can(r)):{PENDING_PD:'HOD_PD',PENDING_ROSTERING:'HOD_ROSTERING',PENDING_CCD:'HOD_CCD',PENDING_FCD:'HOD_FCD'}[s.status],member=[s.a.vjc,s.b.vjc].includes(data.user.vjc),change=data.changes.find(c=>c.swap===id&&['PENDING_PARTNER_CONFIRMATION','PENDING_ADMIN'].includes(c.status));show(`<h2>Cặp ${esc(id)}</h2><p>Phiên bản ${s.version} · ${pill(s.status)}</p>${meInfo(s)}${swapProgress(s)}<div class="info">${s.workflow?s.workflow.steps.map(step=>step.join(' + ')).join(' → '):(s.crewGroup==='PILOT'?'PD → Rostering → FCD':'PD → Rostering → CCD')}${(s.workflow?s.workflow.externalApproval:s.policyVersion||s.crewGroup==='PILOT')?' → Ghi nhận phê duyệt cấp tiếp theo':''} → AIMS.</div><p>${kindName(s.requestKind)} · ${esc(s.crewGroup||'CCD')}</p>${pairComparison(s.a,s.b)}${s.requestKind==='COMPANY'?`<section class="panel"><h3>Lịch sau hoán đổi</h3>${pairComparison(s.resultA,s.resultB)}</section>`:''}${s.externalApproval?`<p>Phê duyệt: ${esc(s.externalApproval.reference)}</p>`:''}${s.comment?`<p>Ý kiến: ${esc(s.comment)}</p>`:''}${change?`<section class="panel"><h3>Đề nghị ${esc(change.kind)}</h3><p>${esc(change.reason)}</p>${pill(change.status)}${member&&change.creator!==data.user.vjc&&change.status==='PENDING_PARTNER_CONFIRMATION'?`<div class="row"><button class="btn primary" onclick="act('confirmChange',{id:${js(change.id)},accept:true})">Đồng ý & gửi Admin</button><button class="btn danger" onclick="act('confirmChange',{id:${js(change.id)},accept:false})">Không đồng ý</button></div>`:''}${can('ADMIN_PD','ADMIN_CCD','ADMIN_FCD')&&change.status==='PENDING_ADMIN'?`<button class="btn primary" onclick="act('applyChange',{id:${js(change.id)}})">Xử lý đề nghị đã đủ 2 xác nhận</button>`:''}</section>`:''}${stageRole&&can(stageRole)?`<div class="field"><label>Ý kiến / lý do trả về</label><textarea id="comment"></textarea></div><div class="row"><button class="btn primary" onclick="act('approve',{id:${js(id)},comment:$('comment').value})">Đồng ý</button><button class="btn danger" onclick="act('return',{id:${js(id)},comment:$('comment').value})">Yêu cầu điều chỉnh</button><button class="btn danger" onclick="rejectSwap(${js(id)})">Từ chối đơn</button></div>`:''}${member&&!change&&!['CANCELLED','COMPLETED','REJECTED','DELETED'].includes(s.status)&&!s.aimsA&&!s.aimsB?`<button class="btn" onclick="changeModal(${js(id)},'CANCEL')">Yêu cầu hủy cặp</button>${s.requestKind!=='COMPANY'?` <button class="btn" onclick="changeModal(${js(id)},'EDIT')">Đề nghị sửa lịch</button>`:''}`:''}${can('ADMIN_PD','ADMIN_CCD','ADMIN_FCD')&&allowed('CHANGE_PROCESS')&&!['CANCELLED','COMPLETED','REJECTED','DELETED'].includes(s.status)&&!s.aimsA&&!s.aimsB?`<button class="btn danger" onclick="adminCancelModal(${js(id)})">Hủy cặp (Admin)</button>`:''}${s.status==='PENDING_AIMS'&&can(s.crewGroup==='PILOT'?'ADMIN_FCD':'ADMIN_CCD')?`<div class="info">Cập nhật trên AIMS trước rồi xác nhận tại đây. Hệ thống chưa có API AIMS.</div><label class="check"><input id="aimsA" type="checkbox" ${s.aimsA?'checked disabled':''}>Đã cập nhật A trên AIMS</label><label class="check"><input id="aimsB" type="checkbox" ${s.aimsB?'checked disabled':''}>Đã cập nhật B trên AIMS</label><button class="btn primary" onclick="act('aims',{id:${js(id)},a:$('aimsA').checked,b:$('aimsB').checked})">Lưu kết quả</button>`:''}`);$('dialog').classList.add('pair-dialog');}
function changeModal(id,kind='EDIT'){const s=data.swaps.find(s=>s.id===id);show(`<h2>${kind==='CANCEL'?'Yêu cầu hủy cặp':'Đề nghị sửa lịch'}</h2><p class="sub">Người còn lại cần xác nhận, sau đó Admin kiểm tra và xử lý. Gửi đề nghị không tự hủy cặp.</p><div class="field"><label>Loại đề nghị</label><select id="kind" onchange="toggleChangeDates(this.value)">${s.requestKind!=='COMPANY'?`<option value="EDIT" ${kind==='EDIT'?'selected':''}>Sửa thời gian & gửi duyệt lại</option>`:''}<option value="CANCEL" ${kind==='CANCEL'?'selected':''}>Hủy cặp, mở lại phiếu gốc</option></select></div><div class="twocol" id="changeDates" ${(kind==='CANCEL'||s.requestKind==='COMPANY')?'hidden':''}><div class="field"><label>Ngày bắt đầu A</label><input id="startA" type="date" value="${esc(s.a.start)}"></div><div class="field"><label>Ngày kết thúc A</label><input id="endA" type="date" value="${esc(s.a.end||'')}"></div><div class="field"><label>Ngày bắt đầu B</label><input id="startB" type="date" value="${esc(s.b.start)}"></div><div class="field"><label>Ngày kết thúc B</label><input id="endB" type="date" value="${esc(s.b.end||'')}"></div></div><div class="field"><label>Lý do</label><textarea id="changeReason"></textarea></div><label class="check"><input id="changeConsent" type="checkbox">Tôi xác nhận đề nghị. Người còn lại cần xác nhận trên web.</label><button class="btn primary" onclick="submitChange(${js(id)})">Gửi đề nghị cho người còn lại</button>`);}
async function submitChange(id){if(!$('changeConsent').checked)return error(Error('Cần xác nhận đề nghị.'));await act('proposeChange',{id,kind:$('kind').value,reason:$('changeReason').value,startA:$('startA').value,startB:$('startB').value,endA:$('endA').value,endB:$('endB').value});}

let userSearchQuery='',marketPage=1,userPage=1,userSearchTimer;

utton class="btn" ${profilePage===pages?'disabled':''} onclick="profilePage++;render()">Sau</button></div></div></section>`;}

tyle="background:${color}"></span>${name}</span><b>${v[status]||0}</b></button>`).join('')}</div></article>`;}).join('')}</div></section>`;}

function externalPage(){const rows=data.swaps.filter(s=>s.status==='PENDING_EXTERNAL_APPROVAL');return head('Phê duyệt cấp tiếp theo','Ghi nhận kết quả đã được DFO và Phó TGĐ phụ trách phê duyệt trước khi thực hiện AIMS.')+rows.map(s=>`<section class="panel"><h3>${esc(s.a.name)} ↔ ${esc(s.b.name)}</h3><p>${kindName(s.requestKind)}</p><button class="btn primary" onclick="externalModal(${js(s.id)})">Ghi nhận kết quả</button></section>`).join('')+(rows.length?'':empty());}
function externalModal(id){show(`<h2>Ghi nhận phê duyệt</h2><div class="field"><label>Mã/link Base hoặc tờ trình được phê duyệt</label><input id="approvalRef" required></div><label class="check"><input id="approvalDFO" type="checkbox">Đã được DFO phê duyệt</label><label class="check"><input id="approvalCOO" type="checkbox">Đã được Phó TGĐ phụ trách phê duyệt</label><button class="btn primary" onclick="act('recordExternalApproval',{id:${js(id)},reference:$('approvalRef').value,dfo:$('approvalDFO').checked,coo:$('approvalCOO').checked})">Lưu kết quả</button>`);}
function policyModal(vjc){const p=data.crew.find(x=>String(x['VJC ID'])===String(vjc));show(`<h2>${esc(p.Name)} · Hồ sơ policy</h2><div class="twocol">${[['pJob','Chức danh',p['Job Title']],['pMain','Căn cứ chính',p['Main Base']],['pSince','Ngày nhận Base (yyyy-mm-dd)',p['Base Since']],['pGroup','Nhóm policy 1–5',p['Policy Group']],['pRequired','Nghĩa vụ yêu cầu (tháng)',p['Obligation Required Months']],['pServed','Nghĩa vụ đã thực hiện (tháng)',p['Obligation Served Months']]].map(([id,label,value])=>`<div class="field"><label>${label}</label><input id="${id}" value="${esc(value||'')}"></div>`).join('')}</div><button class="btn primary" onclick="savePolicy(${js(vjc)},${js(p['Crew Group'])})">Lưu hồ sơ đã xác nhận</button>`);}
async function savePolicy(vjc,crewGroup){try{await rpc('updatePolicyProfile',token,{vjc,crewGroup,jobTitle:$('pJob').value.trim().toUpperCase(),mainBase:$('pMain').value.trim().toUpperCase(),baseSince:$('pSince').value,policyGroup:$('pGroup').value,obligationRequired:$('pRequired').value,obligationServed:$('pServed').value});$('dialog').close();await refresh();}catch(e){error(e);}}
function companyPage(){if(manageTab==='reserve')return reservePage();const all=(data.assignments||[]).filter(r=>!['RESERVE','DELETED','CANCELLED'].includes(r.Status)),rows=all.filter(r=>orderWhere({requestKind:'COMPANY',from:r['Current Base'],to:r['Transfer Base'],start:r['From Date'],created:r['Created At'],status:r.Status})),drafts=all.filter(r=>r.Status==='DRAFT');return `<section class="panel"><div class="row between"><div><h2>Danh sách thuyên chuyển theo phân công</h2><p class="sub">${rows.length} / ${all.length} tiếp viên · Thông báo qua ME khi công bố hoặc cập nhật.</p></div><div class="row">${can('ADMIN_PD')?'<button class="btn primary" onclick="companyAssignmentModal()">+ Thêm tiếp viên</button>':''}<button class="btn" onclick="downloadCompanyTemplate()">Tải mẫu Excel (.xlsx)</button>${drafts.length?`<button class="btn primary" onclick="publishCompanyDrafts()">Công bố ${drafts.length} bản nháp</button>`:''}</div></div><details class="company-import"><summary>Import danh sách từ Excel / CSV</summary><ol class="steps"><li>Chọn file</li><li>Kiểm tra dữ liệu</li><li>Lưu nháp</li><li>Công bố</li></ol><p class="sub">Nhận trực tiếp mẫu PD, tối đa 500 người. Chuẩn hóa VJC ID, ngày Excel; giữ quyền lợi và ghi chú.</p><input aria-label="Chọn file phân công PD" type="file" accept=".xlsx,.csv" onchange="readCompanyFile(this.files[0])"><div id="companyPreview"></div></details></section>${orderFilters()}<section class="panel"><div class="tablewrap"><table><thead><tr><th>Tổ bay</th><th>Base</th><th>Thời gian</th><th>Trạng thái</th>${can('ADMIN_PD')?'<th>Thao tác</th>':''}</tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.Name)}<small>${esc(r['VJC ID'])} · ${esc(r['Crew Group'])} · ${esc(r['Job Title']||'Chưa xác nhận')}</small></td><td>${esc(r['Current Base'])} → ${esc(r['Transfer Base'])}</td><td>${date(r['From Date'])}<small>${r['To Date']?date(r['To Date']):'Không xác định thời hạn'}</small></td><td>${pill(r.Status)}</td>${can('ADMIN_PD')?`<td><div class="row"><button class="btn" onclick="companyAssignmentModal(${js(r['Assignment ID'])})">Sửa</button><button class="btn danger" onclick="deleteCompanyModal(${js(r['Assignment ID'])})">Xóa</button></div></td>`:''}</tr>`).join('')}</tbody></table></div>${rows.length?'':empty()}</section>`;}
async function publishCompanyDrafts(){const rows=(data.assignments||[]).filter(r=>r.Status==='DRAFT'),imports=[...new Set(rows.map(r=>r['Import ID']))];if(!rows.length||!confirm('Công bố '+rows.length+' phân công nháp và gửi thông báo cho các tiếp viên?'))return;try{for(const id of imports){const result=await rpc('publishCompanyImport',token,id,crypto.randomUUID());mailDeliveryFeedback(result.emailDelivery);}await refresh();}catch(e){await refresh().catch(()=>{});error(e);}}
