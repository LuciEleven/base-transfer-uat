function downloadCompanyTemplate(){const bytes=Uint8Array.from(atob(pdTemplateXlsx),c=>c.charCodeAt(0)),a=document.createElement('a'),url=URL.createObjectURL(new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.href=url;a.download='BaseTransfer-PD-Import-Template.xlsx';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1000);}

function csvRows(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell='';}else cell+=c;}if(quoted)throw Error('CSV chưa đóng dấu ngoặc kép.');row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows;}
async function xlsxRows(buffer){const bytes=new Uint8Array(buffer),v=new DataView(buffer),files={};let end=bytes.length-22;while(end>=0&&v.getUint32(end,true)!==0x06054b50)end--;if(end<0)throw Error('File Excel không hợp lệ.');let offset=v.getUint32(end+16,true),count=v.getUint16(end+10,true);if(count>1000)throw Error('File Excel quá lớn.');for(let i=0;i<count;i++){if(v.getUint32(offset,true)!==0x02014b50)throw Error('Cấu trúc Excel lỗi.');const compression=v.getUint16(offset+10,true),size=v.getUint32(offset+20,true),plainSize=v.getUint32(offset+24,true),nl=v.getUint16(offset+28,true),el=v.getUint16(offset+30,true),cl=v.getUint16(offset+32,true),local=v.getUint32(offset+42,true),name=new TextDecoder().decode(bytes.slice(offset+46,offset+46+nl));if(plainSize>10000000)throw Error('Một phần dữ liệu Excel quá lớn.');if((name.endsWith('.xml')||name.endsWith('.rels'))&&(name.startsWith('xl/')||name.startsWith('_rels/'))){const start=local+30+v.getUint16(local+26,true)+v.getUint16(local+28,true),compressed=bytes.slice(start,start+size);let raw;if(compression===0)raw=compressed;else if(compression===8){const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('deflate-raw'));const reader=stream.getReader(),chunks=[];let total=0;while(true){const part=await reader.read();if(part.done)break;total+=part.value.length;if(total>10000000){await reader.cancel();throw Error('Dữ liệu Excel quá lớn.');}chunks.push(part.value);}raw=new Uint8Array(total);let at=0;for(const chunk of chunks){raw.set(chunk,at);at+=chunk.length;}}else throw Error('Không hỗ trợ định dạng nén Excel này.');if(raw.length>10000000)throw Error('Dữ liệu Excel quá lớn.');files[name]=new TextDecoder().decode(raw);}offset+=46+nl+el+cl;}const xml=t=>{const d=new DOMParser().parseFromString(t||'','application/xml');if(d.querySelector('parsererror'))throw Error('XML Excel không hợp lệ.');return d;},wb=xml(files['xl/workbook.xml']),first=wb.getElementsByTagName('sheet')[0];if(['1','true'].includes(wb.getElementsByTagName('workbookPr')[0]?.getAttribute('date1904')))throw Error('File dùng hệ ngày 1904; đổi sang mẫu import trước khi upload.');if(!first)throw Error('Không tìm thấy sheet.');const id=first.getAttribute('r:id'),rels=xml(files['xl/_rels/workbook.xml.rels']),rel=[...rels.getElementsByTagName('Relationship')].find(r=>r.getAttribute('Id')===id);if(!rel)throw Error('Không tìm thấy worksheet.');const target=rel.getAttribute('Target').replace(/^\//,''),path=target.startsWith('xl/')?target:'xl/'+target;const shared=files['xl/sharedStrings.xml']?[...xml(files['xl/sharedStrings.xml']).getElementsByTagName('si')].map(n=>n.textContent):[],sheet=xml(files[path]),rows=[];for(const n of sheet.getElementsByTagName('row')){const row=[];for(const c of n.getElementsByTagName('c')){const ref=c.getAttribute('r')||'',letters=ref.replace(/[0-9]/g,''),index=[...letters].reduce((a,c)=>a*26+c.charCodeAt(0)-64,0)-1;if(index<0||index>50)throw Error('Cột Excel không hợp lệ.');if(c.getElementsByTagName('f').length)throw Error('File import phải chứa giá trị, không dùng công thức.');const t=c.getAttribute('t'),val=c.getElementsByTagName('v')[0]?.textContent||'';row[index]=t==='s'?shared[Number(val)]:t==='inlineStr'?c.getElementsByTagName('is')[0]?.textContent||'':val;}if(row.some(v=>String(v||'').trim()))rows.push(row);if(rows.length>525)throw Error('Tối đa 500 dòng dữ liệu và 20 dòng tiêu đề.');}return rows;}
function prepareCompanyRows(rows){const clean=v=>String(v??'').replace(/^\ufeff/,'').trim(),headerAt=rows.slice(0,20).findIndex(row=>row.some(v=>clean(v).toUpperCase()==='VJC ID')&&row.some(v=>['TRANSFER TO BASE','TRANSFER BASE'].includes(clean(v).toUpperCase())));if(headerAt<0)throw Error('Không tìm thấy header VJC ID / TRANSFER TO BASE. Hỗ trợ mẫu PD gốc và mẫu chuẩn.');const headers=rows[headerAt].map(clean),used=headers.filter(Boolean);if(new Set(used.map(h=>h.toUpperCase())).size!==used.length)throw Error('Tên cột bị trùng.');const native=headers.some(h=>h.toUpperCase()==='TRANSFER TO BASE'),required=native?['VJC ID','POSITION','CURRENT BASE','TRANSFER TO BASE','TRANSFER DATE']:companyColumns.filter(h=>!['Assignment ID','Benefit Reference'].includes(h));if(required.some(h=>!headers.some(k=>k.toUpperCase()===h.toUpperCase())))throw Error('Thiếu cột bắt buộc: '+required.filter(h=>!headers.some(k=>k.toUpperCase()===h.toUpperCase())).join(', '));const sourceRows=rows.slice(headerAt+1).map((r,i)=>({r,line:headerAt+i+2})).filter(({r})=>r.some(v=>clean(v)));if(!sourceRows.length||sourceRows.length>500)throw Error('Import từ 1 đến 500 dòng.');return sourceRows.map(({r,line})=>{const obj={_sourceLine:line};headers.forEach((h,i)=>{if(h){let key=native&&['VJC ID','FULL NAME','POSITION','CURRENT BASE','TRANSFER TO BASE','TRANSFER DATE','NO.'].includes(h.toUpperCase())?h.toUpperCase():h;obj[key]=clean(r[i]);}});return obj;});}
async function readCompanyFile(file){try{if(!file)return;if(file.size>10000000)throw Error('File tối đa 10 MB.');const rows=file.name.toLowerCase().endsWith('.xlsx')?await xlsxRows(await file.arrayBuffer()):csvRows(await file.text());companyRows=prepareCompanyRows(rows);const result=await rpc('previewCompanyImport',token,companyRows);companyPreview=result.rows;renderCompanyPreview();}catch(e){companyRows=[];companyPreview=[];if($('companyPreview'))$('companyPreview').innerHTML='';error(e);}}

function renderCompanyPreview(){const valid=companyPreview.every(r=>r.ok);$('companyPreview').innerHTML=`<h3>Kết quả kiểm tra · ${companyPreview.length} dòng</h3><p>Ngày được đọc từ TRANSFER DATE trong file. Note chỉ là ghi chú, không tự tạo hoặc ghép Swap.</p><div class="tablewrap"><table><tr><th>Dòng / VJC ID</th><th>Họ tên / chức danh</th><th>Current Base → Base đến</th><th>Ngày điều chuyển</th><th>Hotel and Air Ticket / Note</th><th>Kết quả</th></tr>${companyPreview.map(r=>`<tr><td>${r.line}<small>${esc(r.sourceVjc||r.vjc)} → ${esc(r.vjc)}</small></td><td>${esc(r.name||r.sourceName||'')}<small>${esc(r.jobTitle||'')}</small></td><td>${esc(r.from)} → ${esc(r.to)}</td><td>${date(r.start)}</td><td>${esc(r.benefits)}<small>${esc(r.note||'')}</small></td><td>${r.ok?'Hợp lệ':esc(r.error)}<small>${esc(r.warning||'')}</small></td></tr>`).join('')}</table></div>${valid&&companyPreview.length?'<label class="check"><input id="pdImportConfirmed" type="checkbox">Tôi đã kiểm tra Base, chức danh và ngày điều chuyển trong file.</label><button class="btn primary" onclick="saveCompanyDraft()">Lưu nháp</button>':'<p>Sửa các dòng lỗi và upload lại. Chưa có dữ liệu nào được ghi.</p>'}`;}

async function saveCompanyDraft(){try{if($('pdImportConfirmed')&&!$('pdImportConfirmed').checked)throw Error('Xác nhận đã kiểm tra danh sách trước khi lưu nháp.');await rpc('saveCompanyImport',token,companyRows,crypto.randomUUID());companyRows=[];companyPreview=[];await refresh();}catch(e){error(e);}}
async function publishCompany(id){if(!confirm('Công bố danh sách và gửi email thông báo cho các tiếp viên?'))return;try{const result=await rpc('publishCompanyImport',token,id,crypto.randomUUID());await refresh();mailDeliveryFeedback(result.emailDelivery);}catch(e){error(e);}}


function defaultView(){if(data.user.roles.includes('CREW'))return 'market';if(data.user.roles.some(r=>['HOD_PD','HOD_ROSTERING','HOD_CCD','HOD_FCD'].includes(r)))return 'review';return manager()?'dashboard':'market';}
function marketEmpty(){return `<div class="empty"><h3>${marketCompatible?'Chưa có người phù hợp với bạn':'Chưa có phiếu theo bộ lọc này'}</h3><p>${marketKind==='COMPANY'?'Kiểm tra vòng, đợt và chức danh; danh sách Công ty chỉ xuất hiện sau khi Admin công bố.':'Thử bỏ bộ lọc hoặc kiểm tra Base và thời gian trên phiếu của bạn.'}</p><button class="btn" onclick="resetMarketFilters()">Bỏ bộ lọc</button>${data.user.roles.includes('CREW')&&marketKind==='PERSONAL'?'<button class="btn primary" onclick="requestModal()">Đăng ký nguyện vọng</button>':''}</div>`;}
async function resetMarketFilters(){query='';marketGroup='';marketCycle='';marketBatch='';marketJob='';marketCompatible=false;await reloadMarket();}
function nextStep(r){const tasks={OPEN:'Tìm người phù hợp trên Market.',CLOSED_MATCHED:'Theo dõi cặp Swap đã tạo.',PENDING_ME:'Admin PD kiểm tra tác vụ tạo ticket ME.',PENDING_PD:'Chờ HOD PD duyệt.',PENDING_ROSTERING:'Chờ HOD Rostering duyệt.',PENDING_CCD:'Chờ HOD CCD duyệt.',PENDING_FCD:'Chờ HOD FCD duyệt.',PENDING_EXTERNAL_APPROVAL:'Admin PD/FOAP ghi nhận phê duyệt DFO và Phó TGĐ.',PENDING_AIMS:r.crewGroup==='PILOT'?'Admin FCD cập nhật AIMS rồi xác nhận.':'Admin CCD cập nhật AIMS rồi xác nhận.',RETURNED_FOR_REVISION:'Xem ý kiến và gửi đề nghị điều chỉnh.',PENDING_ADMIN:'Admin xử lý đề nghị đã đủ hai xác nhận.',PENDING_PARTNER_CONFIRMATION:'Chờ người còn lại xác nhận đề nghị.',COMPLETED:'Đã xác nhận cập nhật AIMS cho hai bên.',CANCELLED:'Đơn đã hủy; xem lịch sử xử lý.'};return tasks[r.status]||'Xem chi tiết và lịch sử xử lý.';}
function swapProgress(s){if(s.workflow)return `<section class="panel"><h3>Flow v${s.workflow.version}</h3><ol class="steps">${s.workflow.steps.map((roles,i)=>`<li class="${i===(s.flowIndex||0)?'current':''}">${roles.map(esc).join(' + ')}</li>`).join('')}</ol><p>${esc(labels[s.status]||s.status)}</p></section>`;const department=s.crewGroup==='PILOT'?'FCD':'CCD',steps=[['PENDING_ME','ME'],['PENDING_PD','PD'],['PENDING_ROSTERING','Rostering'],['PENDING_'+department,department],...(s.policyVersion||s.crewGroup==='PILOT'?[['PENDING_EXTERNAL_APPROVAL','Phê duyệt cấp tiếp theo']]:[]),['PENDING_AIMS','AIMS'],['COMPLETED','Hoàn tất']],at=steps.findIndex(([status])=>status===s.status);return `<section class="panel"><h3>${esc(nextStep(s))}</h3><ol class="steps">${steps.map(([status,label],i)=>`<li class="${i===at?'current':i<at&&at>=0?'done':''}" ${i===at?'aria-current="step"':''}>${esc(label)}</li>`).join('')}</ol>${at<0?`<p>${esc(labels[s.status]||s.status)}</p>`:''}<small>Tiến trình hiển thị theo trạng thái hiện tại. Xem lịch sử để đối chiếu các lần trả về hoặc điều chỉnh.</small></section>`;}
function accessPage(){if(!can('SUPER_ADMIN'))return empty();return head('Phân quyền','Vai trò chuẩn và quyền chức năng. Chỉ Super Admin được cấu hình.')+`<div class="row"><button class="btn ${accessTab==='roles'?'primary':''}" onclick="accessTab='roles';render()">Vai trò</button>${allowed('PERMISSION_CONFIG')?`<button class="btn ${accessTab==='permissions'?'primary':''}" onclick="accessTab='permissions';render()">Quyền chức năng</button>`:''}</div>`+`<button class="btn" onclick="accessTab='flows';render()">Cấu hình Flow Duyệt Đơn</button>`+(accessTab==='flows'?flowPage():accessTab==='permissions'&&allowed('PERMISSION_CONFIG')?permissionsPage():rolesPage());}
function aimsPreview(){return aimsRows.length?`<div class="tablewrap"><table><tr><th>VJC-ID</th><th>Base</th><th></th></tr>${aimsRows.map((r,i)=>`<tr><td>${esc(r.vjc)}</td><td>${esc(r.base)}</td><td><button class="btn" onclick="removeAimsRow(${i})">Bỏ dòng</button></td></tr>`).join('')}</table></div>`:'<p class="sub">Chưa thêm người nào. Danh sách chưa được ghi vào DB.</p>';}
function addAimsRow(){const vjc=$('aimsVjc').value.trim(),base=$('aimsBase').value;if(!vjc)return error(Error('Nhập VJC-ID.'));if(aimsRows.some(r=>r.vjc===vjc))return error(Error('VJC-ID đã có trong danh sách.'));if(aimsRows.length>=100)return error(Error('Tối đa 100 người mỗi lần.'));aimsRows.push({vjc,base});$('aimsPreview').innerHTML=aimsPreview();$('aimsConfirmed').checked=false;$('aimsVjc').value='';}
function removeAimsRow(i){aimsRows.splice(i,1);$('aimsPreview').innerHTML=aimsPreview();$('aimsConfirmed').checked=false;}
const meImportColumns=['legacy','vjc','email','to','month','start','end','reason','created'];
function downloadMETemplate(){const a=document.createElement('a'),url=URL.createObjectURL(new Blob(['\ufeff'+meImportColumns.join(',')+'\r\n'],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='BaseTransfer-ME-Import.csv';a.click();URL.revokeObjectURL(url);}
async function readMEFile(file){meImportRows=[];meImportChecked=false;try{if(!file)return;if(file.size>1000000)throw Error('File tối đa 1 MB.');const rows=csvRows(await file.text()),headers=(rows.shift()||[]).map(h=>String(h).replace(/^\ufeff/,'').trim());if(new Set(headers).size!==headers.length||meImportColumns.some(h=>!headers.includes(h)))throw Error('Header không đúng mẫu CSV.');meImportRows=rows.filter(r=>r.some(v=>String(v||'').trim())).map(r=>Object.fromEntries(headers.map((h,i)=>[h,String(r[i]||'').trim()])));const result=await rpc('previewLegacyImport',token,meImportRows);meImportChecked=result.valid;meImportReview=result.rows;$('meImportPreview').innerHTML=meImportPreview();}catch(e){meImportRows=[];meImportReview=[];error(e);$('meImportPreview').innerHTML=meImportPreview();}}
let meImportReview=[];
function meImportPreview(){if(!meImportRows.length)return '<p class="sub">Chọn file mẫu đã điền để kiểm tra. Chưa có dữ liệu nào được nhập.</p>';return `<h3>Kết quả kiểm tra · ${meImportReview.length} dòng</h3><div class="tablewrap"><table><tr><th>Dòng</th><th>ME ID / VJC-ID</th><th>Kết quả</th></tr>${meImportReview.map(r=>`<tr><td>${r.line}</td><td>${esc(r.legacy)} · ${esc(r.vjc)}</td><td>${r.ok?'Hợp lệ':esc(r.error)}</td></tr>`).join('')}</table></div>${meImportChecked?'<label class="check"><input id="meImportConfirmed" type="checkbox">Tôi đã đối chiếu ME; các phiếu này không thuộc cặp đang xử lý.</label><button class="btn primary" onclick="importRows()">Xác nhận nhập</button>':'<p>Sửa các dòng lỗi rồi chọn lại file. Cả lô chưa được ghi.</p>'}`;}


function hasOpenApplication(){return data.requests.some(r=>r.vjc===data.user.vjc&&!['CANCELLED','REJECTED','DELETED','COMPLETED','CLOSED_MATCHED'].includes(r.status))||data.swaps.some(s=>[s.a?.vjc,s.b?.vjc].includes(data.user.vjc)&&!['CANCELLED','REJECTED','DELETED','COMPLETED','PENDING_AIMS'].includes(s.status));}
function pendingFlowRoles(s){return s.workflow&&!['PENDING_ME','PENDING_ADMIN','PENDING_AIMS','PENDING_EXTERNAL_APPROVAL'].includes(s.status)&&s.status.startsWith('PENDING_')?(s.workflow.steps[s.flowIndex||0]||[]).filter(r=>!(s.flowApproved||[]).includes(r)):[];}
function rejectSwap(id){if(confirm('Từ chối đơn? Hai thành viên được phép tạo đơn mới.'))act('reject',{id,comment:$('comment').value});}
let companyBase='',companySearch='';
function companyMarketPage(){const rows=(data.companyList||[]).filter(r=>(!companyBase||r.from===companyBase||r.to===companyBase)&&(!marketGroup||r.crewGroup===marketGroup)&&[r.name,r.vjc,r.from,r.to].join(' ').toLowerCase().includes(companySearch.toLowerCase()));return head('Market','Danh sách phân công Công ty tại tất cả Base. Thông báo qua email; không yêu cầu xác nhận nguyện vọng.',data.user.roles.includes('CREW')?'<button class="btn primary" onclick="companySwapModal()">Đăng ký đổi Base được phân công</button>':'')+`<section class="panel"><div class="row"><button class="btn" onclick="setMarketKind('PERSONAL')">Theo nguyện vọng</button><button class="btn primary" onclick="setMarketKind('COMPANY')">Theo phân công Công ty</button></div><div class="twocol"><div class="field"><label>Base liên quan</label><select onchange="companyBase=this.value;render()"><option value="">Tất cả Base</option>${data.bases.map(b=>`<option ${companyBase===b?'selected':''}>${esc(b)}</option>`).join('')}</select></div><div class="field"><label>Tìm tiếp viên / VJC ID</label><input value="${esc(companySearch)}" onchange="companySearch=this.value;render()"></div></div>${companyListTable(rows)}</section>`;}
function companyListTable(rows){return `<div class="tablewrap"><table><thead><tr><th>Họ tên / VJC ID</th><th>Current Base</th><th>Base điều chuyển</th><th>Hiệu lực (giờ VN)</th><th>Trạng thái</th></tr></thead><tbody>${rows.map(r=>`<tr ${r.vjc===data.user.vjc?'style="background:#fff6db"':''}><td>${esc(r.name)}${r.vjc===data.user.vjc?' · Bạn':''}<small>${esc(r.vjc)}</small></td><td>${esc(r.from)}</td><td>${esc(r.to)}</td><td>${r.effectiveAt?esc(r.effectiveAt.replace('T',' ')):date(r.start)}</td><td>${esc(r.status==='SWAPPED'?'Đã hoán đổi':'Đã công bố')}</td></tr>`).join('')}</tbody></table></div>${rows.length?'':empty()}`;}
function companySwapModal(){const own=(data.companyList||[]).find(r=>r.vjc===data.user.vjc&&r.status==='PUBLISHED'),candidates=(data.companyList||[]).filter(r=>r.canSwap);show(`<h2>Đăng ký chuyển Base</h2><div class="field"><label for="registrationType">Loại đăng ký</label><select id="registrationType" onchange="requestModal(null,this.value)"><option value="PERSONAL">Theo nguyện vọng</option><option value="COMPANY" selected>Đổi Base được phân công</option></select></div>${!own?'<div class="info">Bạn chưa có phân công Công ty đang mở do PD công bố. Sau khi PD import và công bố danh sách, bạn có thể chọn người để đổi Base đích tại đây.</div>':`<p>${esc(data.user.name)} · ${esc(data.user.vjc)}</p><div class="twocol"><div class="field"><label>Current Base (theo phân công PD)</label><input value="${esc(own.from)}" readonly></div><div class="field"><label>Base được phân công ban đầu</label><input value="${esc(own.to)}" readonly></div></div><p>Chọn người đổi Base đích. Current Base và thời gian của từng người được giữ theo phân công PD.</p><div class="field"><label for="companyPartner">Người muốn đổi Base đích</label><select id="companyPartner" onchange="renderCompanySwapComparison()"><option value="">Chọn tiếp viên</option>${candidates.map(r=>`<option value="${esc(r.id)}">${esc(r.name)} · ${esc(r.vjc)} · ${esc(r.from)} → ${esc(r.to)}</option>`).join('')}</select></div><div id="companySwapComparison"></div>${candidates.length?'':'<div class="info">Chưa có người đủ điều kiện: cùng nhóm, chức danh và vòng phân công; Base đích khác nhau và sau đổi phải khác Current Base. Hai người có thể cùng Current Base và cùng đợt.</div>'}<label class="check"><input id="companyConsent" type="checkbox">Tôi đã xem phương án sau Swap và đồng ý gửi đề nghị.</label><p class="sub">Người còn lại xác nhận đề nghị Swap trước khi gửi duyệt. Email phân công ban đầu không yêu cầu xác nhận.</p><button class="btn primary" ${candidates.length?'':'disabled'} onclick="submitCompanySwap()">Gửi đề nghị Swap</button>`}`);}
function renderCompanySwapComparison(){const own=(data.companyList||[]).find(r=>r.vjc===data.user.vjc&&r.status==='PUBLISHED'),partner=(data.companyList||[]).find(r=>r.id===$('companyPartner').value);$('companyConsent').checked=false;$('companySwapComparison').innerHTML=own&&partner?`<div class="tablewrap"><table><thead><tr><th>Tiếp viên</th><th>Current Base</th><th>Base đích trước Swap</th><th>Base đích sau Swap</th><th>Ngày điều chuyển</th></tr></thead><tbody>${[[own,partner.to],[partner,own.to]].map(([r,to])=>`<tr><td>${esc(r.name)}<small>${esc(r.vjc)}</small></td><td>${esc(r.from)}</td><td>${esc(r.to)}</td><td><b>${esc(to)}</b></td><td>${date(r.start)}</td></tr>`).join('')}</tbody></table></div>`:'';}

function submitCompanySwap(){const id=$('companyPartner').value;if(!id)return error(Error('Chọn người đổi Base.'));act('match',{id,consent:$('companyConsent').checked});}
function companyAssignmentModal(id){if(!can('ADMIN_PD'))return;const r=id?data.assignments.find(x=>x['Assignment ID']===id):null,meta=r?JSON.parse(r['Original Assignment JSON']||'{}'):{};show(`<h2>${r?'Sửa phân công Công ty':'Thêm tiếp viên vào phân công'}</h2><p class="sub">${r&&r.Status!=='DRAFT'?'Lưu cập nhật phân công đã công bố sẽ gửi thông báo ME.':'Lưu nháp, sau đó công bố để thông báo cho tiếp viên.'}</p><div class="twocol"><div class="field"><label for="assignmentVjc">VJC ID</label><input id="assignmentVjc" value="${esc(r?.['VJC ID']||'')}" ${r?'readonly':''}></div><div class="field"><label for="assignmentGroup">Nhóm tổ bay</label><select id="assignmentGroup" onchange="assignmentJobs(this.value)">${['CCD','PILOT'].map(k=>`<option ${k===(r?.['Crew Group']||'CCD')?'selected':''}>${k}</option>`).join('')}</select></div><div class="field"><label for="assignmentJob">Chức danh</label><select id="assignmentJob">${assignmentJobOptions(r?.['Crew Group']||'CCD',r?.['Job Title'])}</select></div><div class="field"><label for="assignmentFrom">Current Base</label><select id="assignmentFrom">${data.bases.map(k=>`<option ${k===r?.['Current Base']?'selected':''}>${k}</option>`).join('')}</select></div><div class="field"><label for="assignmentTo">Base điều chuyển</label><select id="assignmentTo"><option value="">Chọn Base</option>${data.bases.map(k=>`<option ${k===r?.['Transfer Base']?'selected':''}>${k}</option>`).join('')}</select></div><div class="field"><label for="assignmentStart">Ngày điều chuyển</label><input id="assignmentStart" type="date" value="${esc(r?.['From Date']||'')}"></div><div class="field"><label for="assignmentTime">Giờ hiệu lực (VN, tùy chọn)</label><input id="assignmentTime" type="time" value="${esc(meta.effectiveAt?.slice(11,16)||'')}"></div><div class="field"><label for="assignmentEnd">Đến ngày (bỏ trống = vô thời hạn)</label><input id="assignmentEnd" type="date" value="${esc(r?.['To Date']||'')}"></div></div><div class="field"><label for="assignmentBenefits">Hotel and Air Ticket</label><textarea id="assignmentBenefits">${esc(r?.['Benefit Reference']||'')}</textarea></div><div class="field"><label for="assignmentNote">Ghi chú</label><textarea id="assignmentNote">${esc(meta.note||'')}</textarea></div><button class="btn primary" onclick="saveAssignment(${js(id||'')},${js(r?.['Updated At']||'')})">${r&&r.Status!=='DRAFT'?'Lưu & thông báo thay đổi':'Lưu nháp'}</button>`);}

function deleteCompanyModal(id){const r=data.assignments.find(x=>x['Assignment ID']===id);if(!r)return;show(`<h2>Xóa phân công Công ty</h2><p>${esc(r.Name)} · ${esc(r['VJC ID'])} · ${esc(r['Current Base'])} → ${esc(r['Transfer Base'])}</p><p class="sub">Phân công sẽ được gỡ khỏi Market; lịch sử vẫn được giữ. Phân công đã công bố sẽ gửi thông báo hủy qua ME.</p><div class="field"><label for="assignmentDeleteReason">Lý do xóa</label><textarea id="assignmentDeleteReason"></textarea></div><button class="btn danger" onclick="act('deleteCompanyAssignment',{id:${js(id)},expectedUpdatedAt:${js(r['Updated At'])},reason:$('assignmentDeleteReason').value})">Xác nhận xóa phân công</button>`);}

async function readReserveFile(file){reserveRows=[];try{if(!file)return;if(file.size>10000000)throw Error('File tối đa 10 MB.');const rows=file.name.toLowerCase().endsWith('.xlsx')?await xlsxRows(await file.arrayBuffer()):csvRows(await file.text()),headers=(rows.shift()||[]).map(v=>String(v).replace(/^\ufeff/,'').trim()),col=headers.indexOf('VJC ID');if(col<0)throw Error('Thiếu cột VJC ID.');reserveRows=rows.filter(r=>r.some(v=>String(v).trim())).map(r=>({vjc:String(r[col]||'').trim(),start:String(r[headers.indexOf('From Date')]||'').trim(),end:String(r[headers.indexOf('To Date')]||'').trim()}));if(!reserveRows.length||reserveRows.length>500||new Set(reserveRows.map(r=>r.vjc)).size!==reserveRows.length)throw Error('Từ 1–500 người, không trùng VJC ID.');$('reserveImportPreview').innerHTML=`<p>${reserveRows.length} tiếp viên: ${reserveRows.map(r=>esc(r.vjc)+' ('+esc(r.start||'chưa chọn')+' → '+esc(r.end||'chưa chọn')+')').join(', ')}</p><button class="btn primary" onclick="act('importReserve',{rows:reserveRows})">Xác nhận import dự bị</button>`;}catch(e){reserveRows=[];error(e);}}
function transferReserveModal(id){const r=data.reserves.find(r=>r['Assignment ID']===id);if(!r)return;show(`<h2>Điều chuyển từ danh sách dự bị</h2><p>${esc(r.Name)} · ${esc(r['VJC ID'])}</p><div class="twocol"><div class="field"><label>Current Base</label><select id="reserveFrom">${data.bases.map(b=>`<option ${b===r['Current Base']?'selected':''}>${esc(b)}</option>`).join('')}</select></div><div class="field"><label>Base điều chuyển đến</label><select id="reserveTo"><option value="">Chọn Base</option>${data.bases.map(b=>`<option>${esc(b)}</option>`).join('')}</select></div></div><div class="twocol"><div class="field"><label>From Date · Ngày giờ bắt đầu (giờ Việt Nam)</label><input id="reserveEffective" type="datetime-local" required value="${esc(r['From Date']?r['From Date']+'T00:00':'')}"></div><div class="field"><label>To Date · Ngày kết thúc</label><input id="reserveEnd" type="date" value="${esc(r['To Date']||'')}"><small>Để trống nếu chưa xác định ngày kết thúc.</small></div></div><div class="field"><label>Ghi chú</label><textarea id="reserveNote" maxlength="2000"></textarea></div><button class="btn primary" onclick="act('transferReserve',{id:${js(id)},from:$('reserveFrom').value,to:$('reserveTo').value,effectiveAt:$('reserveEffective').value,end:$('reserveEnd').value,note:$('reserveNote').value})">Điều chuyển & gửi thông báo</button>`);}
let flowGroup='CCD',flowKind='PERSONAL';
function flowPage(){const key=flowGroup+':'+flowKind,c=data.approvalFlows?.[key]||{version:0,steps:[['HOD_PD'],['HOD_ROSTERING'],[flowGroup==='PILOT'?'HOD_FCD':'HOD_CCD']],externalApproval:true};return `<section class="panel"><h2>Cấu hình Flow Duyệt Đơn</h2><p>Flow mới chỉ áp dụng cho cặp tạo sau khi lưu. Đơn đang chạy giữ nguyên phiên bản.</p><div class="twocol"><div class="field"><label>Nhóm</label><select onchange="flowGroup=this.value;render()">${['CCD','PILOT'].map(k=>`<option ${flowGroup===k?'selected':''}>${k}</option>`).join('')}</select></div><div class="field"><label>Loại đơn</label><select onchange="flowKind=this.value;render()">${['PERSONAL','COMPANY'].map(k=>`<option value="${k}" ${flowKind===k?'selected':''}>${kindName(k)}</option>`).join('')}</select></div></div><p>Phiên bản hiện tại: ${c.version}. Mỗi dòng là một bước; dùng dấu + để duyệt song song, tất cả role trong bước đều phải duyệt.</p><div class="field"><label>Các bước duyệt</label><textarea id="flowSteps">${esc(c.steps.map(step=>step.join(' + ')).join('\n'))}</textarea><small>Role: HOD_PD, HOD_ROSTERING, ${flowGroup==='PILOT'?'HOD_FCD':'HOD_CCD'}. Không lặp role.</small></div><label class="check"><input id="flowExternal" type="checkbox" ${c.externalApproval?'checked':''}>Yêu cầu ghi nhận phê duyệt cấp tiếp theo trước AIMS</label><button class="btn primary" onclick="saveFlow(${c.version})">Lưu phiên bản flow mới</button></section>`;}
function saveFlow(expectedVersion){const steps=$('flowSteps').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>l.split('+').map(r=>r.trim().toUpperCase()));act('saveApprovalFlow',{crewGroup:flowGroup,requestKind:flowKind,steps,externalApproval:$('flowExternal').checked,expectedVersion});}

const pages={access:accessPage,external:externalPage,roles:rolesPage,crew:crewPage,permissions:permissionsPage,market,mine,swaps,dashboard,review,manage,changes,aims,users,operations,import:importPage};start();

function toggleChangeDates(kind){$('changeDates').hidden=kind==='CANCEL';}
function adminCancelModal(id){const s=data.swaps.find(s=>s.id===id);show(`<h2>Hủy cặp Swap bởi Admin</h2><p>${esc(s.a.name)} (${esc(s.a.vjc)}) ↔ ${esc(s.b.name)} (${esc(s.b.vjc)})</p><p class="sub">Hai người sẽ được thông báo qua email ME. Phiếu gốc chỉ mở lại nếu còn đủ điều kiện.</p><div class="field"><label for="adminCancelReason">Lý do hủy cặp</label><textarea id="adminCancelReason" required></textarea></div><button class="btn danger" onclick="submitAdminCancel(${js(id)})">Xác nhận hủy cặp</button>`);}
async function submitAdminCancel(id){const reason=$('adminCancelReason').value.trim();if(!reason)return error(Error('Nhập lý do hủy cặp.'));if(!confirm('Hủy cặp Swap này và thông báo cho cả hai người?'))return;await act('cancelSwap',{id,reason});}
function mailDeliveryFeedback(delivery){if(delivery&&(delivery.failed||delivery.review||delivery.pending))error(Error(delivery.message||'Thao tác đã lưu. Email ME chưa gửi thành công hoặc kết quả chưa xác định; kiểm tra Email & vận hành. Không bấm lặp lại thao tác nghiệp vụ.'));}
</script></body></html>
